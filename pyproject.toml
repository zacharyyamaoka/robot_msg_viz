[build-system]
# WHY >=1.27: the first hatchling that writes PEP 639 metadata (the robot-sdk packages' template).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robot-msg-viz"
version = "0.1.0"
description = "A stock Rerun viewer for every robot_msgs type: show(msg), save(path, msg) or stream them, each with a preconfigured blueprint."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/robot_msg_viz/assets/ur5e/LICENSE.ur_description"]
authors = [{ name = "Zach Yamaoka" }]
requires-python = ">=3.11"
keywords = ["robotics", "rerun", "visualization", "robot_msgs", "ros", "blueprint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.26",
    # WHY robot-msgs[rerun]: its robot_msgs.viz.rerun is the logger every view here starts from
    # (one stock logger per type, grown, never a second copy); this package adds the views,
    # samples, streaming and the gallery on top. >=0.4.0: the recorded streams and the dataset nouns (Recording, Run,
    # Dataset, RunComparison, DatasetComparison) the stream and run views draw.
    "robot-msgs[rerun]>=0.6.0",  # 0.6.0: robot_msgs.fiducial (views/fiducial.py); 0.5.0: CollisionScene
    # WHY pinned exactly, the same pin as robot_msgs and traj_compare: an .rrd must be opened by a
    # viewer at least as new as the SDK that wrote it, and the gallery links that one viewer version.
    "rerun-sdk==0.40.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
robot-msg-viz = "robot_msg_viz.__main__:main"

[project.urls]
Homepage = "https://github.com/zacharyyamaoka/robot_msg_viz"
Repository = "https://github.com/zacharyyamaoka/robot_msg_viz"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_msg_viz"]

[tool.uv.sources]
# WHY absolute: every robot-sdk sibling lives at /home/bam/<repo> (traj_compare's convention).
robot-msgs = { path = "/home/bam/robot_msgs", editable = true }
robot-dashboards = { path = "/home/bam/robot_dashboards", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
# WHY: the landing page lists robot_dashboards' use cases (found through its entry point, never imported here).
site = ["robot-dashboards"]

[tool.uv]
# WHY: one environment that always holds the installed use cases, so the gallery and the site see them.
default-groups = ["site"]
